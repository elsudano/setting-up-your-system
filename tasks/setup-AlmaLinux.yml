---
- name: 'Include vault/{{ ansible_facts["distribution"] }}.yml and {{ ansible_facts["distribution"] }}.yml variables in order to complete the tasks'
  tags: always
  include_vars: "{{ item }}.yml"
  with_items:
    - '{{ ansible_facts["distribution"] }}'
    - 'vault/{{ ansible_facts["distribution"] }}'

- name: Install all packages that we will need in our system
  tags: packages
  block:
    - name: Add repositories at the list
      ansible.builtin.yum_repository:
        name: "{{ item.filename }}"
        description: "{{ item.description }}"
        file: "{{ item.filename }}"
        baseurl: "{{ item.repo }}"
        metalink: "{{ item.metalink }}"
        gpgcheck: "{{ item.gpgcheck }}"
        repo_gpgcheck: "{{ item.repo_gpgcheck }}"
        enabled: "{{ item.enabled }}"
        metadata_expire: "{{ item.metadata_expire }}"
      with_items: "{{ repo_list }}"

    - name: Upgrade all packages
      ansible.builtin.dnf:
        name: "*"
        state: latest

    - name: Install packages that we have in the list
      ansible.builtin.dnf:
        name: "{{ item.packages }}"
        state: "{{ item.state }}"
      with_items: "{{ package_list }}"

# All tasks for RedHad family SO
- name: Changing the size max of files that were can handle for Visual Studio Code
  lineinfile:
    path: /etc/sysctl.conf
    regexp: 'fs.inotify.max_user_watches='
    line: fs.inotify.max_user_watches=524288
    create: yes
  become: true
