---
- name: 'Include vault/{{ ansible_facts["distribution"] }}.yml and {{ ansible_facts["distribution"] }}.yml variables in order to complete the tasks'
  tags: always
  include_vars: "{{ item }}.yml"
  with_items:
    - '{{ ansible_facts["distribution"] }}'
    - 'vault/{{ ansible_facts["distribution"] }}'

# All tasks for RedHad family SO
- name: Upgrade all packages to the latest version (Fedora)
  ansible.builtin.dnf:
    name: "*"
    state: latest
  become: true
  become_method: sudo

- name: All related to install packages
  become: true
  tags: packages
  block:
    - name: Set all the repositories that we need to install all the tools that we use.
      ansible.builtin.yum_repository:
        name: "{{ item.name }}"
        description: "{{ item.description }}"
        baseurl: "{{ item.repo }}"
        file: "{{ item.filename }}"
        state: "{{ item.state }}"
        gpgcheck: "{{ item.gpgcheck | default(true) }}"
        gpgkey: "{{ item.repo_key | default(omit) }}"
        enabled: "{{ item.enabled | default(true) }}"
      with_items:
        "{{ repo_list }}"
      when: ("WSL" not in ansible_facts["kernel"]) or (item.repo_key | default('', true) | trim != '')

    - name: Install and Remove the Custom Packages that we want
      ansible.builtin.dnf:
        name: "{{ item.packages }}"
        state: "{{ item.state }}"
        allowerasing: yes
        update_cache: yes
      with_items:
        "{{ package_list }}"

- name: Changing the size max of files that were can handle for Visual Studio Code
  lineinfile:
    path: /etc/sysctl.conf
    regexp: 'fs.inotify.max_user_watches='
    line: fs.inotify.max_user_watches=524288
    create: yes
  become: true
