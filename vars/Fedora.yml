---
# We can use this variable in order to set all the repositories that we want
# @required
repo_list:
  - state: present
    repo: 'https://packages.microsoft.com/yumrepos/vscode'
    name: 'code'
    filename: 'vscode'
    description: 'Visual Studio Code'
    repo_key: 'https://packages.microsoft.com/keys/microsoft.asc'
  - state: present
    repo: 'https://rpm.releases.hashicorp.com/fedora/$releasever/$basearch/stable'
    name: 'hashicorp_stable'
    filename: 'hashicorp'
    description: 'Hashicorp Stable - Fedora $releasever - $basearch'
    repo_key: 'https://rpm.releases.hashicorp.com/gpg'
  - state: present
    repo: 'https://rpm.releases.hashicorp.com/fedora/$releasever/$basearch/test'
    name: 'hashicorp_test'
    filename: 'hashicorp'
    description: 'Hashicorp Tests - Fedora $releasever - $basearch'
    repo_key: 'https://rpm.releases.hashicorp.com/gpg'

# With this variable we can install or remove all the applications that we have or we want in our Workstation
# @required
package_list:
  - state: present
    packages:
      - code
      - ansible-core
      - terraform
      - kgpg
      - btop
      - ca-certificates
      - curl
      - net-tools
      - git
      - gnupg2
      - jq
      - tree
      - dnsmasq
      - nano
      - python3-firewall
      - python3-passlib
      - python3-debian
      - firewalld
      - nfs-utils
  - state: absent
    packages:
      - vim
